<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>POSsible Coffee | Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=7" />
  <style>
    /* Critical header styles: kept here so local previews always render correctly. */
    .site-header{width:min(1180px,calc(100% - 40px))!important;min-height:92px!important;margin:0 auto!important;padding-top:max(12px,env(safe-area-inset-top))!important;display:flex!important;align-items:center!important;justify-content:space-between!important;border:0!important;box-shadow:none!important}
    .brand{display:flex!important;align-items:center!important;gap:11px!important;color:#123437!important;text-decoration:none!important;font:700 1.05rem/1 "DM Sans",sans-serif!important;letter-spacing:-.06em!important}.brand>span:last-child span{color:#07957b!important}.brand-mark{position:relative!important;display:block!important;width:42px!important;height:42px!important;border:4px solid #c1ede2!important;border-radius:50%!important;background:#149b82!important}.brand-mark i{position:absolute!important;width:5px!important;height:5px!important;border-radius:50%!important;background:#fff!important}.brand-mark i:nth-child(1){top:7px!important;left:7px!important}.brand-mark i:nth-child(2){top:15px!important;left:5px!important}.brand-mark i:nth-child(3){bottom:6px!important;left:12px!important}.header-actions{display:flex!important;align-items:center!important;gap:12px!important}.theme-toggle,.language-toggle{border:1px solid #d8e5e2!important;background:#fff!important;color:#102126!important;cursor:pointer!important}.theme-toggle{display:grid!important;place-items:center!important;width:48px!important;height:48px!important;padding:0!important;border-radius:50%!important;font-size:1.1rem!important}.language-toggle{padding:13px 20px!important;border-radius:999px!important;font-weight:700!important;font-size:.82rem!important}
    @media(max-width:680px){.site-header{width:calc(100% - 28px)!important;min-height:calc(74px + env(safe-area-inset-top))!important}.brand{font-size:1rem!important}.brand-mark{width:35px!important;height:35px!important}.header-actions{gap:8px!important}.theme-toggle{width:43px!important;height:43px!important}.language-toggle{padding:11px 15px!important;font-size:.76rem!important}}
    .possible-word{font-size:1.12em!important}.brand .possible-word span{color:#07957b!important}.brand-mark{display:grid!important;place-items:center!important;border:0!important;background:#e2f4ee!important}.brand-mark::before{content:"☕"!important;color:#078b73!important;font-size:25px!important;line-height:1!important}.brand-mark i{display:none!important}
    /* Critical cart styles: prevents a cached stylesheet from exposing the dialogs in page flow. */
    .cart-layer,.checkout-layer{position:fixed!important;z-index:1000!important;inset:0!important;display:grid!important;visibility:hidden!important;pointer-events:none!important}.cart-layer{justify-items:end!important}.checkout-layer{place-items:center!important;padding:20px!important}.cart-layer.is-open,.checkout-layer.is-open{visibility:visible!important;pointer-events:auto!important}.cart-backdrop,.checkout-backdrop{position:absolute!important;inset:0!important;background:rgba(6,28,26,.46)!important}.cart-drawer,.checkout-modal{position:relative!important;z-index:1!important;background:#fffefd!important;color:#102126!important;box-shadow:0 24px 60px rgba(0,0,0,.25)!important}.cart-drawer{width:min(430px,100%)!important;height:100%!important;display:flex!important;flex-direction:column!important}.checkout-modal{width:min(590px,100%)!important;max-height:calc(100vh - 40px)!important;overflow:auto!important;border-radius:14px!important}.drawer-header{display:flex!important;align-items:center!important;justify-content:space-between!important;padding:22px 23px 18px!important;border-bottom:1px solid #d8e5e2!important}.cart-items{flex:1!important;overflow:auto!important;padding:15px 22px!important}.cart-footer{padding:17px 22px 24px!important;border-top:1px solid #d8e5e2!important}.cart-total,.summary-total{display:flex!important;justify-content:space-between!important}.checkout-button,.confirm-button{padding:14px!important;border:0!important;border-radius:8px!important;background:#078b73!important;color:#fff!important;font-weight:800!important;cursor:pointer!important}.checkout-button{width:100%!important}.quantity-controls{display:flex!important;align-items:center!important;gap:7px!important}.quantity-controls button{width:28px!important;height:28px!important;border:1px solid #d8e5e2!important;border-radius:5px!important;background:#fff!important;cursor:pointer!important}.quantity-controls .remove-item{width:auto!important;border:0!important;color:#c6443b!important}.cart-item{display:grid!important;grid-template-columns:58px 1fr auto!important;gap:11px!important;padding:13px 0!important;border-bottom:1px solid #d8e5e2!important}.cart-item img{width:58px!important;height:58px!important;border-radius:8px!important;object-fit:cover!important}@media(max-width:680px){.checkout-layer{align-items:end!important;padding:0!important}.checkout-modal{width:100%!important;max-height:92vh!important;border-radius:15px 15px 0 0!important}}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#menu-book" aria-label="POSsible Coffee menu"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand-name"><span class="possible-word">POS<span>sible</span></span> Coffee</span></a>
    <div class="header-actions"><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode"><span aria-hidden="true">☾</span></button><button class="cart-toggle" id="cart-toggle" type="button" aria-label="Open cart"><span aria-hidden="true">🛒</span><span class="cart-badge" id="cart-badge" hidden>0</span></button><button class="language-toggle" id="language-toggle" type="button" aria-label="Switch language">العربية</button></div>
  </header>

  <main>
    <section class="menu-intro" aria-labelledby="menu-heading">
      <p class="eyebrow" id="menu-subtitle">OUR MENU</p>
      <h1 id="menu-heading">Made for your moment.</h1>
    </section>

    <section class="book-shell" aria-label="POSsible Coffee menu book">
      <div class="book" id="book">
        <article class="menu-page menu-page--left" id="page-left"></article>
        <div class="book-spine" aria-hidden="true"></div>
        <article class="menu-page menu-page--right" id="page-right"></article>
      </div>
    </section>

    <nav class="book-controls" aria-label="Menu page navigation">
      <button class="nav-button" id="previous" type="button" aria-label="Previous pages">
        <span aria-hidden="true">←</span><span id="previous-label">Previous</span>
      </button>
      <p class="page-indicator" id="page-indicator" aria-live="polite"></p>
      <button class="nav-button nav-button--next" id="next" type="button" aria-label="Next pages">
        <span id="next-label">Next</span><span aria-hidden="true">→</span>
      </button>
    </nav>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand"><img class="footer-logo" src="assets/possible-logo.svg" alt="POSsible logo" /><strong>POS<span>sible</span></strong></div>
      <div class="social-links" aria-label="POSsible social media">
        <a class="social-link social-link--whatsapp" href="https://api.whatsapp.com/message/CT27TF7KJJIXB1?autoload=1&amp;app_absent=0" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><img src="https://cdn.simpleicons.org/whatsapp/FFFFFF" alt="" /></a>
        <a class="social-link social-link--facebook" href="https://www.facebook.com/profile.php?id=61592487043152&amp;rdid=lDCwWxZnBBfN3lEL&amp;share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F1PRN4jkeRu%2F%23" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><img src="https://cdn.simpleicons.org/facebook/FFFFFF" alt="" /></a>
        <a class="social-link social-link--instagram" href="https://www.instagram.com/possible.sol/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="https://cdn.simpleicons.org/instagram/FFFFFF" alt="" /></a>
        <a class="social-link social-link--email" href="mailto:possiblesolution00@gmail.com" aria-label="Email POSsible Solution"><img src="https://cdn.simpleicons.org/gmail/FFFFFF" alt="" /></a>
        <!-- Replace # with your real social-media profile links. -->
        <a href="#" aria-label="Instagram">IG</a>
        <a href="#" aria-label="Facebook">f</a>
        <a href="#" aria-label="TikTok">♪</a>
        <a href="#" aria-label="WhatsApp">◔</a>
      </div>
      <p>© <span id="copyright-year"></span> POSsible. <span class="footer-divider">·</span> <span id="footer-rights">All rights reserved.</span></p>
    </div>
  </footer>
  <div class="cart-layer" id="cart-layer" aria-hidden="true"><div class="cart-backdrop" data-cart-close></div><aside class="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cart-title"><div class="drawer-header"><h2 id="cart-title">Your cart</h2><button class="icon-close" type="button" data-cart-close aria-label="Close">×</button></div><div class="cart-items" id="cart-items"></div><div class="cart-footer"><div class="cart-total"><span id="subtotal-label">Subtotal</span><strong id="cart-total">0 EGP</strong></div><button class="checkout-button" id="checkout-button" type="button">Checkout</button></div></aside></div>
  <div class="checkout-layer" id="checkout-layer" aria-hidden="true"><div class="checkout-backdrop" data-checkout-close></div><section class="checkout-modal" role="dialog" aria-modal="true" aria-labelledby="checkout-title"><div class="drawer-header"><h2 id="checkout-title">Complete your order</h2><button class="icon-close" type="button" data-checkout-close aria-label="Close">×</button></div><form id="checkout-form" novalidate><div class="checkout-fields"><label id="customer-field"><span id="customer-label">Customer Name</span><input name="customerName" autocomplete="name" /></label><label id="table-field"><span id="table-label">Table Number</span><input name="tableNumber" inputmode="numeric" /></label><label id="order-type-field"><span id="order-type-label">Order Type</span><select name="orderType"><option value="dineIn">Dine In</option><option value="takeaway">Takeaway</option></select></label><label id="notes-field"><span id="notes-label">Notes</span><textarea name="notes" rows="3"></textarea></label></div><div class="order-summary"><h3 id="summary-title">Order summary</h3><div id="summary-items"></div><div class="summary-total"><span id="total-label">Total</span><strong id="summary-total">0 EGP</strong></div></div><p class="form-error" id="form-error" role="alert"></p><button class="confirm-button" type="submit" id="confirm-button">Confirm Order</button></form></section></div>
  <script src="script.js?v=3"></script>
</body>
</html>
