<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#35251e" />
  <title>POSsible Coffee | Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=4" />
  <style>
    /* Critical header styles: kept here so local previews always render correctly. */
    .site-header{width:min(1180px,calc(100% - 40px))!important;min-height:92px!important;margin:0 auto!important;padding-top:max(12px,env(safe-area-inset-top))!important;display:flex!important;align-items:center!important;justify-content:space-between!important;border:0!important;box-shadow:none!important}
    .brand{display:flex!important;align-items:center!important;gap:11px!important;color:#123437!important;text-decoration:none!important;font:700 1.05rem/1 "DM Sans",sans-serif!important;letter-spacing:-.06em!important}.brand>span:last-child span{color:#07957b!important}.brand-mark{position:relative!important;display:block!important;width:42px!important;height:42px!important;border:4px solid #c1ede2!important;border-radius:50%!important;background:#149b82!important}.brand-mark i{position:absolute!important;width:5px!important;height:5px!important;border-radius:50%!important;background:#fff!important}.brand-mark i:nth-child(1){top:7px!important;left:7px!important}.brand-mark i:nth-child(2){top:15px!important;left:5px!important}.brand-mark i:nth-child(3){bottom:6px!important;left:12px!important}.header-actions{display:flex!important;align-items:center!important;gap:12px!important}.theme-toggle,.language-toggle{border:1px solid #d8e5e2!important;background:#fff!important;color:#102126!important;cursor:pointer!important}.theme-toggle{display:grid!important;place-items:center!important;width:48px!important;height:48px!important;padding:0!important;border-radius:50%!important;font-size:1.1rem!important}.language-toggle{padding:13px 20px!important;border-radius:999px!important;font-weight:700!important;font-size:.82rem!important}
    @media(max-width:680px){.site-header{width:calc(100% - 28px)!important;min-height:calc(74px + env(safe-area-inset-top))!important}.brand{font-size:1rem!important}.brand-mark{width:35px!important;height:35px!important}.header-actions{gap:8px!important}.theme-toggle{width:43px!important;height:43px!important}.language-toggle{padding:11px 15px!important;font-size:.76rem!important}}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#menu-book" aria-label="POSsible Coffee menu"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>POS<span>sible</span> Coffee</span></a>
    <div class="header-actions"><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode"><span aria-hidden="true">☾</span></button><button class="language-toggle" id="language-toggle" type="button" aria-label="Switch language">العربية</button></div>
  </header>

  <main>
    <section class="menu-intro" aria-labelledby="menu-heading">
      <p class="eyebrow" id="menu-subtitle">OUR MENU</p>
      <h1 id="menu-heading">Made for your moment.</h1>
    </section>

    <section class="book-shell" aria-label="POSsible Coffee menu book">
      <div class="book" id="book">
        <article class="menu-page menu-page--left" id="page-left"></article>
        <div class="book-spine" aria-hidden="true"></div>
        <article class="menu-page menu-page--right" id="page-right"></article>
      </div>
    </section>

    <nav class="book-controls" aria-label="Menu page navigation">
      <button class="nav-button" id="previous" type="button" aria-label="Previous pages">
        <span aria-hidden="true">←</span><span id="previous-label">Previous</span>
      </button>
      <p class="page-indicator" id="page-indicator" aria-live="polite"></p>
      <button class="nav-button nav-button--next" id="next" type="button" aria-label="Next pages">
        <span id="next-label">Next</span><span aria-hidden="true">→</span>
      </button>
    </nav>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand"><img class="footer-logo" src="assets/possible-logo.svg" alt="POSsible logo" /><strong>POS<span>sible</span></strong></div>
      <div class="social-links" aria-label="POSsible social media">
        <!-- Replace # with your real social-media profile links. -->
        <a href="#" aria-label="Instagram">IG</a>
        <a href="#" aria-label="Facebook">f</a>
        <a href="#" aria-label="TikTok">♪</a>
        <a href="#" aria-label="WhatsApp">◔</a>
      </div>
      <p>© <span id="copyright-year"></span> POSsible. <span class="footer-divider">·</span> <span id="footer-rights">All rights reserved.</span></p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
